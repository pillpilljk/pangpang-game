
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PangPang Board Pro: Reaction Master</title>
    <meta name="description" content="An advanced reaction time training game for the 3x3 PangPang pressure sensor board, featuring 5 specialized training stages and detailed performance analytics." />
    <meta property="og:title" content="PangPang Board Pro: Reaction Master" />
    <meta property="og:description" content="An advanced reaction time training game for the 3x3 PangPang pressure sensor board, featuring 5 specialized training stages and detailed performance analytics." />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-border {
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5), inset 0 0 5px rgba(56, 189, 248, 0.2);
        }
        .neon-text-blue {
            text-shadow: 0 0 5px #0ea5e9, 0 0 10px #0ea5e9;
        }
        .neon-text-green {
            text-shadow: 0 0 5px #22c55e, 0 0 10px #22c55e;
        }
        .grid-button {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .grid-button:active {
            transform: scale(0.92);
        }
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 50;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(56, 189, 248, 0.1) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 6s linear infinite;
        }
        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100px; }
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="scanline"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
